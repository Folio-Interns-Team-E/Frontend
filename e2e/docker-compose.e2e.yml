services:
  postgres-e2e:
    image: postgres:16
    container_name: salessync_postgres_e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salessync_e2e
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salessync_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
